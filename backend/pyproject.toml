[tool.poetry]
name = "fintech-admin-api"
version = "0.1.0"
description = "FastAPI backend for the fintech operations admin prototype"
authors = ["Fintech Admin Team"]
readme = "../README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.115.6"
pydantic-settings = "2.7.0"
uvicorn = { version = "0.32.1", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
httpx = "0.28.1"
mypy = "1.13.0"
pytest = "8.3.4"
ruff = "0.8.4"
pre-commit = "4.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
